# PostgreSQL profile: activate with SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fellasbar}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER:fellasbar_user}
spring.datasource.password=${PGPASSWORD:fellasbar_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
spring.sql.init.mode=never

