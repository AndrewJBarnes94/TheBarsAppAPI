spring.application.name=FellasBarAPI
server.port=${PORT:8080}

# Default profile: H2 in-memory database (for development)
spring.datasource.url=jdbc:h2:mem:fellasbar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Mail
resend.api-key=${RESEND_API_KEY:}
fellasbar.mail.from=${MAIL_FROM:onboarding@resend.dev}
fellasbar.mail.store-notify=${STORE_NOTIFY_EMAIL:hq@fellasnetwork.com}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
app.base-url=${APP_BASE_URL:http://localhost:8080}
