<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<body>
<div th:fragment="content">

    <section class="page-hero">
        <div class="page-hero-content">
            <p class="eyebrow">Fellas · Store</p>
            <h1>Reset Password</h1>
            <p>Choose a new password for your account.</p>
        </div>
    </section>

    <section class="content-section tiki-bg">
        <div class="auth-card">

            <div th:if="${error}" class="store-notice" style="background:#2a0a0a; border-color:#c0392b; color:#e74c3c;">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/store/reset-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="token" th:value="${token}"/>
                <div class="auth-field">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password"/>
                </div>
                <div class="auth-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required minlength="8" autocomplete="new-password"/>
                </div>
                <button type="submit" class="btn-primary-full">Set New Password</button>
            </form>

        </div>
    </section>

</div>
</body>
</html>
