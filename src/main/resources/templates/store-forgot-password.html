<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<body>
<div th:fragment="content">

    <section class="page-hero">
        <div class="page-hero-content">
            <p class="eyebrow">Fellas · Store</p>
            <h1>Forgot Password</h1>
            <p>We'll send you a reset link.</p>
        </div>
    </section>

    <section class="content-section tiki-bg">
        <div class="auth-card">

            <div th:if="${sent}" class="store-notice" style="background:#0a2a0a; border-color:#27ae60; color:#2ecc71;">
                If that email has an account, a reset link is on its way.
            </div>
            <div th:if="${error}" class="store-notice" style="background:#2a0a0a; border-color:#c0392b; color:#e74c3c;">
                <span th:text="${error}"></span>
            </div>

            <form th:if="${!sent}" th:action="@{/store/forgot-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
                </div>
                <button type="submit" class="btn-primary-full">Send Reset Link</button>
            </form>

            <p class="auth-switch"><a th:href="@{/store/login}">Back to Sign In</a></p>
        </div>
    </section>

</div>
</body>
</html>
