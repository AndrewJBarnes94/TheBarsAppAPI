<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<body>
<div th:fragment="content">

    <section class="page-hero">
        <div class="page-hero-content">
            <p class="eyebrow">Fellas · Store</p>
            <h1>Create Account</h1>
            <p>Quick sign-up to complete your order.</p>
        </div>
    </section>

    <section class="content-section tiki-bg">
        <div class="auth-card">
            <div th:if="${error}" class="store-notice" style="background:#2a0a0a; border-color:#c0392b; color:#e74c3c;">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/store/register}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
                </div>
                <div class="auth-field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="(813) 555-0100" required autocomplete="tel"/>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Choose a password" required autocomplete="new-password" minlength="8"/>
                </div>
                <div class="auth-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required autocomplete="new-password" minlength="8"/>
                </div>
                <button type="submit" class="btn-primary-full">Create Account</button>
            </form>

            <p class="auth-switch">Already have an account? <a th:href="@{/store/login}">Sign in</a></p>
        </div>
    </section>

</div>
</body>
</html>
