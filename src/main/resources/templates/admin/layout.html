<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — Fellas HQ' : 'Fellas HQ'}">Fellas HQ</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <nav class="top-nav">
        <a th:href="@{/admin}" class="nav-brand">Fellas HQ</a>
        <div class="nav-links">
            <a th:href="@{/admin}">Dashboard</a>
            <a th:href="@{/admin/targets}">Target List</a>
            <a th:href="@{/admin/venues/new}">+ New Venue</a>
            <a th:href="@{/admin/history}">History</a>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-link">Logout</button>
            </form>
        </div>
    </nav>
    <main class="container">
        <div th:replace="~{::content}">Content goes here</div>
    </main>
</body>
</html>
