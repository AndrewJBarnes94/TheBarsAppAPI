<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: html}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1>Venues</h1>
        <a th:href="@{/admin/venues/new}" class="btn btn-primary">+ New Venue</a>
    </div>

    <div th:if="${#lists.isEmpty(venues)}" class="empty-state">
        <p>No venues yet. Add your first venue to get started.</p>
    </div>

    <table th:unless="${#lists.isEmpty(venues)}" class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Rating</th>
                <th>Specials</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="venue : ${venues}">
                <td th:text="${venue.id}"></td>
                <td th:text="${venue.name}"></td>
                <td><span class="badge" th:text="${venue.type}"></span></td>
                <td th:text="${venue.rating != null ? venue.rating : '—'}"></td>
                <td th:text="${venue.specials.size()}"></td>
                <td class="actions">
                    <a th:href="@{/admin/venues/{id}/edit(id=${venue.id})}" class="btn btn-sm">Edit</a>
                    <a th:href="@{/admin/venues/{id}/specials/new(id=${venue.id})}" class="btn btn-sm btn-secondary">+ Special</a>
                    <form th:action="@{/admin/venues/{id}/delete(id=${venue.id})}" method="post" class="inline-form"
                          onsubmit="return confirm('Delete this venue and all its data?');">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
