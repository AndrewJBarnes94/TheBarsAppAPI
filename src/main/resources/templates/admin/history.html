<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: html}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1>Activity History</h1>
        <p class="subtitle">Track all changes made by users</p>
    </div>

    <div th:if="${#lists.isEmpty(logs)}" class="empty-state card">
        <p>No activity recorded yet.</p>
    </div>

    <table th:unless="${#lists.isEmpty(logs)}" class="data-table">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>User</th>
                <th>Action</th>
                <th>Type</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${#temporals.format(log.timestamp, 'MMM d, yyyy h:mm a')}">Jan 1, 2025 12:00 PM</td>
                <td><span class="badge badge-user" th:text="${log.username}">admin</span></td>
                <td>
                    <span th:class="${'badge badge-' + log.action.toLowerCase()}" th:text="${log.action}">CREATE</span>
                </td>
                <td th:text="${log.entityType}">VENUE</td>
                <td th:text="${log.details}">Details here</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
