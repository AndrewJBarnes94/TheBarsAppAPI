<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: html}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1>Approve Portal Request</h1>
        <a th:href="@{/admin/business-users}" class="btn">← Business Users</a>
    </div>

    <div class="form-card" style="max-width:520px;">
        <p style="margin-bottom:1.5rem;color:#888;">
            Review the request details below. Set a temporary password and optionally link a venue before approving.
        </p>

        <div style="background:#1a1a1a;border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.5rem;">
            <div style="display:flex;gap:2rem;flex-wrap:wrap;">
                <div><span style="color:#888;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;">Name</span><br><strong th:text="${user.name}"></strong></div>
                <div><span style="color:#888;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;">Email</span><br><strong th:text="${user.email}"></strong></div>
                <div><span style="color:#888;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;">Venue Name</span><br><strong th:text="${user.venueName ?: '—'}"></strong></div>
            </div>
        </div>

        <form th:action="@{/admin/business-users/{id}/approve(id=${user.id})}" method="post">
            <div class="form-group">
                <label>Temporary Password</label>
                <input type="password" name="password" required placeholder="Set a password for this account"/>
                <small style="color:#888;">Share this with the venue owner so they can log in.</small>
            </div>
            <div class="form-group">
                <label>Link to Venue (optional)</label>
                <select name="venueId">
                    <option value="">— Select a venue —</option>
                    <option th:each="v : ${venues}" th:value="${v.id}" th:text="${v.name}"></option>
                </select>
                <small style="color:#888;">Link now, or the owner can request it later.</small>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Approve &amp; Activate</button>
                <form th:action="@{/admin/business-users/{id}/reject(id=${user.id})}" method="post" class="inline-form"
                      onsubmit="return confirm('Reject and remove this request?');">
                    <button type="submit" class="btn btn-danger">Reject</button>
                </form>
            </div>
        </form>
    </div>
</div>
</body>
</html>
