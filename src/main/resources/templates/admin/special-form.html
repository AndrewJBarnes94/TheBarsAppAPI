<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: html}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 th:text="${special.id != null ? 'Edit Special' : 'New Special'}">Special Form</h1>
        <span class="subtitle" th:text="'Venue: ' + ${venue.name}"></span>
    </div>

    <form th:action="${special.id != null ? '/admin/specials/' + special.id : '/admin/venues/' + venue.id + '/specials'}"
          method="post" class="card">

        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" th:value="${special.name}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="2" th:text="${special.description}"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="originalPrice">Original Price ($)</label>
                <input type="number" step="0.01" min="0" id="originalPrice" name="originalPrice"
                       th:value="${special.originalPrice}">
            </div>
            <div class="form-group">
                <label for="specialPrice">Special Price ($)</label>
                <input type="number" step="0.01" min="0" id="specialPrice" name="specialPrice"
                       th:value="${special.specialPrice}">
            </div>
        </div>

        <div class="form-group">
            <label for="dayOfWeek">Day of Week</label>
            <select id="dayOfWeek" name="dayOfWeek">
                <option value="">— Select —</option>
                <option value="Daily" th:selected="${special.dayOfWeek == 'Daily'}">Daily</option>
                <option th:each="day : ${daysOfWeek}"
                        th:value="${day}" th:text="${day}" th:selected="${special.dayOfWeek == day}"></option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary"
                    th:text="${special.id != null ? 'Update Special' : 'Create Special'}">Save</button>
            <a th:href="@{/admin/venues/{id}/edit(id=${venue.id})}" class="btn">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
