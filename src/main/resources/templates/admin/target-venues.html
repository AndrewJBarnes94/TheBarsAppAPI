<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: html}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1>Target Venues - St. Pete 33716 Area</h1>
        <p class="subtitle">Select a venue to add to the database. Greyed out venues have already been added.</p>
    </div>

    <div th:if="${#lists.isEmpty(targetVenues)}" class="empty-state card">
        <p>No target venues loaded yet.</p>
    </div>

    <div th:unless="${#lists.isEmpty(targetVenues)}" class="target-grid">
        <div th:each="target : ${targetVenues}"
             th:class="${target.isAdded ? 'target-card added' : 'target-card'}">
            <div class="target-info">
                <h3 th:text="${target.name}">Venue Name</h3>
                <span class="badge" th:text="${target.type}">Type</span>
                <p th:if="${target.address}" th:text="${target.address}">Address</p>
                <a th:if="${target.website}" th:href="${target.website}" target="_blank" class="website-link">Website</a>
            </div>
            <div class="target-actions">
                <span th:if="${target.isAdded}" class="added-badge">
                    Added by <span th:text="${target.addedBy}">user</span>
                </span>
                <a th:unless="${target.isAdded}" th:href="@{/admin/targets/{id}/add(id=${target.id})}"
                   class="btn btn-primary btn-sm">Add This Venue</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
