<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<body>
<div th:fragment="content">

    <section class="page-hero" style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center;">
        <div class="page-hero-content">
            <p class="eyebrow" style="color: #06d6a0;">Order Confirmed</p>
            <h1>Order confirmed.</h1>
            <p style="margin-bottom: 2rem;">Thanks for the support — we'll get it shipped out to you soon.</p>
            <a th:href="@{/store}" class="btn-primary">Back to Store</a>
        </div>
    </section>

    <section th:if="${guestEmail}" class="content-section tiki-bg" style="padding-top:0; padding-bottom:3rem;">
        <div class="auth-card" style="max-width:420px;">
            <h3 style="margin-bottom:0.5rem;">Save your info for next time</h3>
            <p style="color:#888; font-size:0.9rem; margin-bottom:1.5rem;">Set a password to create an account and track your orders.</p>

            <div th:if="${passwordError}" class="store-notice" style="background:#2a0a0a; border-color:#c0392b; color:#e74c3c; margin-bottom:1rem;">
                <span th:text="${passwordError}"></span>
            </div>

            <form th:action="@{/store/set-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="email" th:value="${guestEmail}"/>
                <div class="auth-field">
                    <label>Email</label>
                    <input type="email" th:value="${guestEmail}" disabled style="opacity:0.5;"/>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password"/>
                </div>
                <div class="auth-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required minlength="8" autocomplete="new-password"/>
                </div>
                <button type="submit" class="btn-primary-full">Create Account</button>
            </form>

            <p class="auth-switch">Already have an account? <a th:href="@{/store/login}">Sign in</a></p>
        </div>
    </section>

</div>
</body>
</html>
