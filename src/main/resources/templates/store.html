<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<body>
<div th:fragment="content">

    <!-- CSRF tokens for JS fetch -->
    <input type="hidden" id="csrf-token" th:value="${_csrf.token}"/>
    <input type="hidden" id="csrf-header" th:value="${_csrf.headerName}"/>

    <section class="page-hero">
        <div class="page-hero-content">
            <p class="eyebrow">Fellas · Merch</p>
            <h1>The Store</h1>
            <p>Rep the brand. Look good doing it.</p>
        </div>
    </section>

    <section class="content-section tiki-bg">
        <div th:if="${param.error}" class="store-notice" style="background:#2a0a0a; border-color:#c0392b; color:#e74c3c;">
            <span>⚠️</span> Something went wrong with checkout. Please try again.
        </div>
        <div class="product-grid">

            <div class="product-card">
                <img class="product-thumb" src="/Images/T-Shirt Green.png" alt="Green T-Shirt">
                <div class="product-info">
                    <h3>Green T-Shirt</h3>
                    <p class="product-desc">Fellas logo tee. Green.</p>
                    <div class="product-bottom">
                        <span class="product-price">$30</span>
                        <button class="btn-cart"
                                data-price-id="price_1TXp3OC7BRhZ6tCETAR8iC0z"
                                data-name="Green T-Shirt"
                                data-price-display="$30"
                                onclick="addToCart(this)">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <img class="product-thumb" src="/Images/T-Shirt Blue.png" alt="Blue T-Shirt">
                <div class="product-info">
                    <h3>Blue T-Shirt</h3>
                    <p class="product-desc">Fellas logo tee. Blue.</p>
                    <div class="product-bottom">
                        <span class="product-price">$30</span>
                        <button class="btn-cart"
                                data-price-id="price_1TXp2OC7BRhZ6tCEdlZJJFDf"
                                data-name="Blue T-Shirt"
                                data-price-display="$30"
                                onclick="addToCart(this)">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <img class="product-thumb" src="/Images/T-Shirt White.png" alt="White T-Shirt">
                <div class="product-info">
                    <h3>White T-Shirt</h3>
                    <p class="product-desc">Fellas logo tee. White.</p>
                    <div class="product-bottom">
                        <span class="product-price">$30</span>
                        <button class="btn-cart"
                                data-price-id="price_1TXp1iC7BRhZ6tCETrTuF1mE"
                                data-name="White T-Shirt"
                                data-price-display="$30"
                                onclick="addToCart(this)">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Floating cart bar -->
    <button class="cart-bar" id="cart-bar" onclick="openCart()"></button>

    <!-- Cart overlay -->
    <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>

    <!-- Cart drawer -->
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="cart-close" onclick="closeCart()">×</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span class="cart-total-amount" id="cart-total">$0.00</span>
            </div>
            <button class="btn-checkout" id="btn-checkout" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <script>
        const CART_KEY = 'fellas-cart';

        function getCart() {
            return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function addToCart(btn) {
            const priceId = btn.dataset.priceId;
            const name = btn.dataset.name;
            const priceDisplay = btn.dataset.priceDisplay;

            const cart = getCart();
            const existing = cart.find(i => i.priceId === priceId);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ priceId, name, priceDisplay, quantity: 1 });
            }
            saveCart(cart);
            updateCartUI();
            openCart();
        }

        function updateQty(btn, delta) {
            const priceId = btn.dataset.priceId;
            const cart = getCart();
            const item = cart.find(i => i.priceId === priceId);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) cart.splice(cart.indexOf(item), 1);
            saveCart(cart);
            updateCartUI();
        }

        function updateCartUI() {
            const cart = getCart();
            const totalItems = cart.reduce((sum, i) => sum + i.quantity, 0);
            const totalDollars = cart.reduce((sum, i) => sum + 30 * i.quantity, 0);

            // Floating bar
            const bar = document.getElementById('cart-bar');
            if (totalItems > 0) {
                bar.classList.add('visible');
                bar.textContent = 'View Cart (' + totalItems + ') · $' + totalDollars.toFixed(2);
            } else {
                bar.classList.remove('visible');
            }

            // Drawer items
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p style="color:#555; text-align:center; padding:2rem 0;">Your cart is empty.</p>';
            } else {
                container.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${item.priceDisplay}</div>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" data-price-id="${item.priceId}" onclick="updateQty(this, -1)">−</button>
                            <span class="qty-num">${item.quantity}</span>
                            <button class="qty-btn" data-price-id="${item.priceId}" onclick="updateQty(this, 1)">+</button>
                        </div>
                    </div>
                `).join('');
            }

            // Total
            document.getElementById('cart-total').textContent = '$' + totalDollars.toFixed(2);

            // Checkout button
            document.getElementById('btn-checkout').disabled = cart.length === 0;
        }

        function openCart() {
            document.getElementById('cart-drawer').classList.add('open');
            document.getElementById('cart-overlay').classList.add('visible');
        }

        function closeCart() {
            document.getElementById('cart-drawer').classList.remove('open');
            document.getElementById('cart-overlay').classList.remove('visible');
        }

        async function checkout() {
            const cart = getCart();
            if (cart.length === 0) return;

            const btn = document.getElementById('btn-checkout');
            btn.disabled = true;
            btn.textContent = 'Redirecting...';

            const csrfToken = document.getElementById('csrf-token').value;
            const csrfHeader = document.getElementById('csrf-header').value;

            try {
                const res = await fetch('/store/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken
                    },
                    body: JSON.stringify(cart.map(i => ({
                        priceId: i.priceId,
                        quantity: i.quantity
                    })))
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.removeItem(CART_KEY);
                    window.location.href = data.url;
                } else {
                    window.location.href = '/store?error=true';
                }
            } catch (e) {
                window.location.href = '/store?error=true';
            }
        }

        document.addEventListener('DOMContentLoaded', updateCartUI);
    </script>

</div>
</body>
</html>
