<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{portal/layout :: html}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 th:text="${venue.name}">Your Venue</h1>
        <span class="badge" th:text="${venue.type}"></span>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-value" th:text="${hoursCount}">0</div>
            <div class="stat-label">Days with Hours Set</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" th:text="${specialsCount}">0</div>
            <div class="stat-label">Active Specials</div>
        </div>
    </div>

    <div class="quick-links">
        <a th:href="@{/portal/profile}" class="quick-link-card">
            <div class="quick-link-icon">🏪</div>
            <div>
                <strong>Profile</strong>
                <p>Update your business info, description, and image</p>
            </div>
        </a>
        <a th:href="@{/portal/hours}" class="quick-link-card">
            <div class="quick-link-icon">🕐</div>
            <div>
                <strong>Hours</strong>
                <p>Set your weekly operating hours</p>
            </div>
        </a>
        <a th:href="@{/portal/specials}" class="quick-link-card">
            <div class="quick-link-icon">🍺</div>
            <div>
                <strong>Specials</strong>
                <p>Manage your happy hours and drink specials</p>
            </div>
        </a>
    </div>
</div>
</body>
</html>
