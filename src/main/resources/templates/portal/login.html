<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Portal — Fellas</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-page">
    <div class="login-card">
        <h1>Business Portal</h1>
        <p class="login-sub">Manage your venue on The Bars App</p>

        <div th:if="${param.error}" class="alert alert-error">
            Invalid email or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You've been logged out.
        </div>

        <form th:action="@{/portal/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="username" required autofocus placeholder="owner@yourvenue.com"/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required/>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>
    </div>
</body>
</html>
