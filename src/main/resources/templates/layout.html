<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — Fellas' : 'Fellas'}">Fellas</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<nav class="site-nav">
    <a th:href="@{/}" class="site-brand"><img src="/Images/Adobe Express - file-2.png" alt="Fellas" class="nav-brand-img"></a>
    <button class="nav-toggle" onclick="this.closest('nav').querySelector('.site-nav-links').classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>
    <div class="site-nav-links">
        <a th:href="@{/store}">Store</a>
        <a th:href="@{/thebarsapp}" class="nav-app-pill">The Bars App ↗</a>
        <span class="nav-divider" sec:authorize="hasRole('CUSTOMER')"></span>
        <a th:href="@{/store/orders}" sec:authorize="hasRole('CUSTOMER')">My Orders</a>
        <form th:action="@{/store/logout}" method="post" sec:authorize="hasRole('CUSTOMER')" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="nav-signout">Sign Out</button>
        </form>
        <a th:href="@{/store/login}" sec:authorize="!hasRole('CUSTOMER')" class="nav-signin">Sign In</a>
    </div>
</nav>

<div th:replace="~{::content}">Content goes here</div>

<footer class="site-footer">
    <span>© 2026 Fellas</span>
    <div class="footer-links">
        <a th:href="@{/store}">Store</a>
        <a th:href="@{/thebarsapp}">The Bars App</a>
    </div>
</footer>

</body>
</html>
