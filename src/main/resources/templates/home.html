<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<body>
<div th:fragment="content">

    <!-- Hero -->
    <section class="brand-hero">
        <div class="brand-hero-content">
            <img src="/Images/Fellas Logo.png" alt="Fellas Logo" class="hero-logo">
            <h1>Built for the beach.<br>Made for the fellas.</h1>
            <div class="hero-ctas">
                <a th:href="@{/store}" class="btn-primary">Shop Merch</a>
                <a th:href="@{/thebarsapp}" class="btn-ghost">Get The Bars App</a>
            </div>
        </div>
    </section>

    <!-- Featured Merch -->
    <section class="content-section featured-merch">
        <div class="section-header">
            <h2>Featured Merch</h2>
            <a th:href="@{/store}" class="see-all">Shop All →</a>
        </div>
        <div class="card-grid">
            <div class="product-card">
                <img class="product-thumb" src="/Images/T-Shirt Green.jpeg" alt="Green T-Shirt">
                <div class="product-info">
                    <h3>Green T-Shirt</h3>
                    <div class="product-bottom">
                        <span class="product-price">$30</span>
                        <a th:href="@{/store}" class="btn-cart">View</a>
                    </div>
                </div>
            </div>
            <div class="product-card">
                <img class="product-thumb" src="/Images/T-Shirt Blue.jpeg" alt="Blue T-Shirt">
                <div class="product-info">
                    <h3>Blue T-Shirt</h3>
                    <div class="product-bottom">
                        <span class="product-price">$30</span>
                        <a th:href="@{/store}" class="btn-cart">View</a>
                    </div>
                </div>
            </div>
            <div class="product-card">
                <img class="product-thumb" src="/Images/T-Shirt White.jpeg" alt="White T-Shirt">
                <div class="product-info">
                    <h3>White T-Shirt</h3>
                    <div class="product-bottom">
                        <span class="product-price">$30</span>
                        <a th:href="@{/store}" class="btn-cart">View</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>
</body>
</html>
