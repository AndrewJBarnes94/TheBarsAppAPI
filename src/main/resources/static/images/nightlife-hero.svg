<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice">
  <defs>

    <!-- Deep night sky -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#020508"/>
      <stop offset="35%"  stop-color="#060b18"/>
      <stop offset="68%"  stop-color="#0c1228"/>
      <stop offset="100%" stop-color="#120c04"/>
    </linearGradient>

    <!-- City ambient glow – warm amber rising from buildings -->
    <radialGradient id="cityGlow" cx="50%" cy="82%" r="62%">
      <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="28%"  stop-color="#c2540a" stop-opacity="0.28"/>
      <stop offset="60%"  stop-color="#7a2e02" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0808" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary glow, slightly left of centre (downtown cluster) -->
    <radialGradient id="cityGlow2" cx="38%" cy="80%" r="40%">
      <stop offset="0%"   stop-color="#ff8c00" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="#a03800" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Water reflection at base -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e1828"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>

    <!-- Reflection shimmer strip -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="60%"  stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </radialGradient>

    <!-- Centred text readability overlay -->
    <radialGradient id="textOverlay" cx="50%" cy="42%" r="50%">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- Bokeh soft-glow helper: repeated radial per circle -->
    <!-- (simulated with multiple concentric circles per light point) -->

  </defs>

